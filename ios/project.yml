name: TransitKit
options:
  bundleIdPrefix: com.transitkit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete

# --------------------------------------------------------------------------
# Swift Package dependencies
# --------------------------------------------------------------------------
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"

targets:
  TransitKit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TransitKit/Sources
        excludes:
          - "**/*.example.swift"
    resources:
      - path: TransitKit/Sources/Resources
    settings:
      base:
        # OPERATOR_ID is overridable from the xcodebuild CLI for white-label
        # builds (e.g. `xcodebuild ... OPERATOR_ID=acme`). When building from
        # the Xcode IDE there is no CLI to pass it on, so we default to
        # `appalcart` here. Without this default the IDE resolves the bundle
        # id to `com.transitkit.` (empty placeholder) which mismatches the
        # bundle id baked into GoogleService-Info.plist → Firebase refuses
        # to configure and FCM never issues a token.
        OPERATOR_ID: appalcart
        # BRAND_NAME (brand dell'APP) e OPERATOR_NAME (operatore di cui
        # mostriamo i dati) sono i due nomi che l'OS legge prima che il
        # codice giri — springboard e prompt permessi — quindi non possono
        # arrivare da config.json a runtime come tutto il resto.
        # build-ios.sh li legge da shared/operators/<op>/config.json
        # (brandName / name) e li passa a xcodebuild. I default qui servono
        # solo alle build da IDE, dove non c'è CLI che li passi — stessa
        # ragione di OPERATOR_ID sopra. Fonte di verità = config.json.
        BRAND_NAME: AppalRider
        OPERATOR_NAME: AppalCART
        PRODUCT_BUNDLE_IDENTIFIER: com.transitkit.${OPERATOR_ID}
        DEVELOPMENT_TEAM: "R56VCP5L45"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TransitKit/Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TransitKit/Sources/App/TransitKit.entitlements
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
          ENABLE_TESTABILITY: NO
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          # APNs production environment for App Store / TestFlight builds.
          # Resolved into TransitKit.entitlements via $(APS_ENVIRONMENT).
          APS_ENVIRONMENT: production
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_COMPILATION_MODE: singlefile
          ENABLE_TESTABILITY: YES
          # APNs sandbox for Xcode-signed dev builds. Production builds
          # override this in the Release config above.
          APS_ENVIRONMENT: development
    info:
      path: TransitKit/Sources/App/Info.plist
      properties:
        # White-label: il display name nello springboard e nei prompt di
        # sistema è il brand dell'APP (BRAND_NAME), NON dell'operatore
        # (OPERATOR_NAME) di cui mostriamo i dati.
        # Il display name NON è localizzato: è un nome proprio, identico in
        # tutte le lingue — per questo non sta in InfoPlist.xcstrings.
        # La usage description invece è localizzata (en/it/es-419) in
        # InfoPlist.xcstrings, che build-ios.sh genera da
        # ios/InfoPlist.template.xcstrings. Il valore qui è il fallback
        # English usato se la xcstrings non risolve.
        CFBundleDisplayName: "$(BRAND_NAME)"
        CFBundleShortVersionString: "1.2.8"
        CFBundleVersion: "18"
        # Apple HIG: la usage description deve spiegare il beneficio per
        # l'utente in modo specifico, distinguere chiaramente chi accede
        # alla posizione (l'app) da chi fornisce i dati (l'operatore), e
        # dare reassurance sulla privacy.
        NSLocationWhenInUseUsageDescription: "$(BRAND_NAME) uses your location to show $(OPERATOR_NAME) stops near you and the most relevant upcoming departures. Your location stays on your device — it's never sent to any server."
        UILaunchScreen:
          UIColorName: SystemBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        # Export compliance: app uses only standard HTTPS (URLSession) +
        # platform-provided crypto. No proprietary or non-exempt encryption.
        # Declaring this here lets Apple skip the question on every submission.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - transitkit
            CFBundleURLName: "com.transitkit.${OPERATOR_ID}"
    dependencies:
      - sdk: MapKit.framework
      - sdk: UserNotifications.framework
      - package: Firebase
        product: FirebaseMessaging
    scheme:
      testTargets:
        - TransitKitTests

  TransitKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TransitKit/Tests
    dependencies:
      - target: TransitKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
